<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02070d">
<title>РАЗГИЛЬДЯИ — Sport Hub</title>
<style>
:root{--bg:#03070d;--pnl:#080f19;--pnl2:#0d1928;--ln:#123348;--tx:#edfaff;--mt:#8ba8b8;--ac:#00d9ff;--ac2:#167dff;--ok:#40f2b0;--wn:#ffc857;--bd:#ff4f83;--r:14px;--tap:44px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Respect the HTML hidden attribute even for elements with explicit display styles. */
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
button{font-family:inherit}
#app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:64px 1fr;grid-template-areas:"top top" "nav main";min-height:100vh;min-height:100dvh}
.topbar{grid-area:top;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--pnl);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-weight:900;color:#111;font-size:16px}
.bn-nm{font-weight:800;font-size:16px}.bn-sb{font-size:12px;color:var(--mt)}
.topbar-actions{display:flex;gap:8px}
.sidenav{grid-area:nav;background:var(--pnl);border-right:1px solid var(--ln);padding:12px 8px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;position:sticky;top:64px;height:calc(100vh - 64px)}
.nav-item{background:0;border:0;color:var(--tx);text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px;display:flex;gap:8px;align-items:center}
.nav-item:hover{background:var(--pnl2)}.nav-item.active{background:var(--ac);color:#111;font-weight:700}
#main{grid-area:main;padding:20px 24px;overflow-y:auto;min-width:0}
.bottomnav{display:none}
h1{font-size:22px;margin:0 0 12px}h2{font-size:18px;margin:20px 0 12px}h3{margin:0 0 12px}
.mut{color:var(--mt)}
.btn{background:var(--pnl2);color:var(--tx);border:1px solid var(--ln);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;min-height:36px}
.btn:hover{background:#242c38}
.btn.pri{background:var(--ac);color:#111;border-color:var(--ac)}.btn.pri:hover{filter:brightness(1.08)}
.btn.dng{background:#3a1a1a;color:#ffb3b3;border-color:#552}
.btn.gho{background:0}.btn.sm{padding:4px 10px;font-size:12px;min-height:28px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,textarea,select{background:var(--pnl2);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit;width:100%;min-height:36px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--ac);border-color:transparent}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:12px;color:var(--mt);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.field{margin-bottom:12px}
.grid{display:grid;gap:16px}.c2{grid-template-columns:repeat(2,1fr)}.c3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--pnl);border:1px solid var(--ln);border-radius:var(--r);padding:16px}
.card h3{margin-top:0}
.crow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bdg{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;background:var(--pnl2);color:var(--mt);border:1px solid var(--ln)}
.bdg.ok{color:var(--ok);border-color:#1d3a2a;background:#12261c}
.bdg.wn{color:var(--wn);border-color:#3a2f1a;background:#26200f}
.bdg.bd{color:var(--bd);border-color:#3a1d1d;background:#261414}
.bdg.ac{color:#111;background:var(--ac);border-color:var(--ac)}
.empty{text-align:center;padding:40px;color:var(--mt)}
.list{display:flex;flex-direction:column;gap:10px}
.li{background:var(--pnl);border:1px solid var(--ln);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.li.ck{cursor:pointer}.li.ck:hover{border-color:var(--ac)}
.prg{height:8px;background:var(--pnl2);border-radius:6px;overflow:hidden}
.prg>div{height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .3s}
.rs{display:flex;gap:6px;flex-wrap:wrap}
.rs button{width:var(--tap);height:var(--tap);border-radius:8px;border:1px solid var(--ln);background:var(--pnl2);color:var(--tx);cursor:pointer;font-size:14px;font-weight:600}
.rs button.on{background:var(--ac);color:#111;border-color:var(--ac)}
.scene{background:var(--pnl);border:1px solid var(--ln);border-radius:12px;margin-bottom:12px;overflow:hidden}
.sh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--pnl2);cursor:pointer;gap:8px;flex-wrap:wrap}
.sh:hover{background:#222a36}
.sb{padding:14px;display:none}.scene.open .sb{display:block}
.sn{background:var(--ac);color:#111;font-weight:800;border-radius:6px;padding:2px 8px;font-size:12px;margin-right:8px}
.st{font-weight:700;flex:1;min-width:0}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac);flex-shrink:0}
.done{text-decoration:line-through;color:var(--mt)}
pre.prompt{background:#0a0d12;border:1px solid var(--ln);border-radius:8px;padding:12px;white-space:pre-wrap;word-break:break-word;font-size:13px;max-height:340px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222a36;border:1px solid var(--ln);padding:10px 18px;border-radius:10px;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.4);max-width:calc(100vw - 32px)}
.toast.err{border-color:var(--bd);color:#ffb3b3}.toast.ok{border-color:var(--ok);color:#b8f0d0}
.cloud-loading{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.58);display:flex;align-items:center;justify-content:center;padding:20px}.cloud-loading-card{display:flex;align-items:center;gap:14px;background:var(--pnl);border:1px solid var(--ln);border-radius:14px;padding:18px 22px;box-shadow:0 10px 36px rgba(0,0,0,.4);max-width:100%}.cloud-spinner{width:28px;height:28px;border:3px solid var(--ln);border-top-color:var(--ac);border-radius:50%;animation:cloud-spin .8s linear infinite;flex-shrink:0}@keyframes cloud-spin{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:grid;place-items:center;z-index:200;padding:20px}
.mc{background:var(--pnl);border:1px solid var(--ln);border-radius:14px;padding:20px;max-width:640px;width:100%;max-height:85vh;overflow-y:auto}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.mh h3{margin:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kc{background:var(--pnl);border:1px solid var(--ln);border-radius:12px;padding:14px}
.kl{font-size:12px;color:var(--mt);text-transform:uppercase;letter-spacing:.5px}
.kv{font-size:24px;font-weight:800;margin-top:4px}
.sv{position:fixed;right:14px;bottom:14px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:14px;color:var(--mt);background:var(--pnl);border:1px solid var(--ln);z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.sv.show{opacity:1}.sv.saving{color:var(--wn)}.sv.saved{color:var(--ok)}.sv.error{color:var(--bd)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:flex;align-items:flex-end}
.sc{background:var(--pnl);border-radius:16px 16px 0 0;width:100%;max-height:80vh;overflow-y:auto;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.sgh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sgg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sgg button{background:var(--pnl2);border:1px solid var(--ln);color:var(--tx);padding:14px 10px;border-radius:10px;cursor:pointer;text-align:left;font-size:13px;min-height:var(--tap)}
.sgf{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--ln)}
.sgf .btn{width:100%;min-height:var(--tap)}
.sc2{background:var(--pnl);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}
.shd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sti{font-size:18px;font-weight:800;line-height:1.25}
.snm{background:var(--ac);color:#111;font-weight:800;border-radius:8px;padding:3px 10px;font-size:13px;white-space:nowrap}
.sb2{margin-bottom:14px}.sb2 label{display:block;font-size:11px;color:var(--mt);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.sv2{font-size:15px;line-height:1.45}.sv2.sm{font-size:14px}
.sac{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sac .btn{min-height:var(--tap);font-size:14px}
.snv{display:flex;gap:8px;margin:0 0 12px}.snv .btn{flex:1;min-height:var(--tap)}
.snt{width:100%;min-height:70px;font-size:15px}
.drop{border:2px dashed var(--ln);border-radius:12px;padding:24px;text-align:center;cursor:pointer;transition:border-color .2s}
.drop:hover,.drop.over{border-color:var(--ac);background:rgba(255,212,0,.05)}
@media (max-width:820px){
  #app{grid-template-columns:1fr;grid-template-rows:56px 1fr 64px;grid-template-areas:"top" "main" "bnav";padding-bottom:env(safe-area-inset-bottom)}
  .topbar{padding:0 12px}.bn-sb{display:none}
  .topbar-actions .btn{padding:6px 10px;font-size:12px;min-height:32px}
  .sidenav{display:none}
  #main{padding:12px 12px 20px}
  .c2,.c3{grid-template-columns:1fr}
  h1{font-size:19px}h2{font-size:16px;margin-top:16px}
  .card{padding:14px}
  .bottomnav{grid-area:bnav;display:grid;grid-template-columns:repeat(5,1fr);background:var(--pnl);border-top:1px solid var(--ln);position:sticky;bottom:0;z-index:60;padding-bottom:env(safe-area-inset-bottom)}
  .bn-item{background:0;border:0;color:var(--mt);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 0;cursor:pointer;font-size:11px}
  .bn-item span{font-size:20px;line-height:1}.bn-item small{font-size:10px}
  .bn-item.active{color:var(--ac)}
  .sv{bottom:76px;right:12px}
  .chk{padding:12px 0}.chk input[type=checkbox]{width:26px;height:26px}
  .sh{padding:14px}
}
@media print{.topbar,.sidenav,.bottomnav,.sv,.btn{display:none!important}#app{display:block}body{background:#fff;color:#000}}

/* NEON CYAN / RAZGILDYAI VISUAL THEME */
html,body{background:radial-gradient(ellipse at 76% -10%,rgba(0,145,255,.16),transparent 42%),radial-gradient(ellipse at 0% 45%,rgba(0,217,255,.06),transparent 35%),var(--bg);}
.topbar{background:rgba(3,8,15,.96);border-bottom:1px solid #123b52;box-shadow:0 5px 24px rgba(0,0,0,.28)}
.brand{gap:13px}.logo.logo-img{width:48px;height:48px;object-fit:cover;border-radius:50%;background:#000;border:2px solid var(--ac);box-shadow:0 0 12px rgba(0,217,255,.38),0 0 28px rgba(0,125,255,.14)}
.bn-nm{font-size:17px;letter-spacing:.6px;text-transform:uppercase;color:#e8fbff;text-shadow:0 0 14px rgba(0,217,255,.18)}
.bn-sb{color:#54cce7;letter-spacing:.15px}
.sidenav{background:rgba(5,11,19,.97);border-right:1px solid #123348}
.nav-item{border:1px solid transparent;border-radius:10px;transition:background .18s,border-color .18s,color .18s;}
.nav-item:hover{background:rgba(0,217,255,.08);border-color:rgba(0,217,255,.2);color:#fff}
.nav-item.active{background:linear-gradient(100deg,rgba(0,217,255,.2),rgba(22,125,255,.08));border-color:rgba(0,217,255,.55);box-shadow:inset 3px 0 0 var(--ac),0 0 18px rgba(0,217,255,.06);color:#dffbff}
#main{background:transparent}
h1,h2{letter-spacing:.15px}h1{color:#f1fcff;text-shadow:0 0 20px rgba(0,217,255,.08)}
#main h1:after{content:"";display:block;width:76px;height:3px;margin-top:9px;border-radius:5px;background:linear-gradient(90deg,var(--ac),transparent);box-shadow:0 0 12px rgba(0,217,255,.6)}
.card,.kc,.sc2,.li,.scene{background:linear-gradient(145deg,rgba(10,22,35,.98),rgba(6,13,22,.98));border-color:#123348;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.card:hover,.kc:hover,.li:hover{border-color:rgba(0,217,255,.35)}
.btn{background:#0b1b2a;border-color:#17445a;transition:all .18s}
.btn:hover{background:#10283c;border-color:#00aeca;box-shadow:0 0 14px rgba(0,217,255,.1)}
.btn.pri{background:linear-gradient(110deg,#00d9ff,#168bff);border-color:#00d9ff;color:#001018;box-shadow:0 0 18px rgba(0,217,255,.17);font-weight:800}
.btn.pri:hover{filter:brightness(1.12);box-shadow:0 0 24px rgba(0,217,255,.28)}
input,textarea,select{background:#071522;border-color:#164056}
input:focus,textarea:focus,select:focus{outline:2px solid var(--ac);box-shadow:0 0 14px rgba(0,217,255,.12)}
.bdg.ac,.sn,.snm,.rs button.on{background:var(--ac);color:#001018;border-color:var(--ac)}
.prg>div{background:linear-gradient(90deg,#00d9ff,#167dff);box-shadow:0 0 12px rgba(0,217,255,.42)}
.sh{background:#0b1b2a}.sh:hover{background:#10263a}
.scene.open{border-color:rgba(0,217,255,.5);box-shadow:0 0 18px rgba(0,217,255,.06)}
.bottomnav{background:rgba(4,10,17,.98);border-top-color:#123348}.bn-item.active{color:var(--ac);text-shadow:0 0 12px rgba(0,217,255,.22)}
.modal{background:rgba(0,4,10,.82);backdrop-filter:blur(7px)}.mc{background:#07111d;border-color:#16506a;box-shadow:0 18px 70px rgba(0,0,0,.55),0 0 26px rgba(0,217,255,.07)}
.sheet{background:rgba(0,4,10,.82);backdrop-filter:blur(7px)}.sc{background:#07111d;border:1px solid #16506a;box-shadow:0 -12px 45px rgba(0,0,0,.4)}
.toast{background:#081522;border-color:#16506a}
.drop{border-color:#164056}.drop:hover,.drop.over{border-color:var(--ac);background:rgba(0,217,255,.05)}
@media(max-width:820px){.logo.logo-img{width:42px;height:42px}.bn-nm{font-size:15px}}

</style>
</head>

  const b=['Внешний вид и состояние площадки/места','Общий план места','Ведущий в кадре','Крупные планы оборудования','Детали и особенности','Процесс тестирования','Реакции ведущего','Плюсы','Минусы','Перебивки','Чистый звук','Запасные дубли','Финальная оценка','Заключительный кадр'];
  if(kind==='venue')b.push('Парковка/вход','Режим работы, цены','Туалеты/раздевалки','Посетители');
  if(kind==='sport')b.push('Экипировка и правила','Первые попытки','Прогресс','Сравнение с ожиданиями');
  return b.map(t=>({id:uid(),text:t,done:false}));
}

/* --- project --- */
function newProject(title){
  const n=now();
  return{id:uid(),title:title||'Новый выпуск',status:'идея',createdAt:n,updatedAt:n,ideaId:null,
    concept:{goal:'',question:'',intrigue:'',path:'',keyEvents:'',successCriteria:'',conditions:'',problems:'',facts:''},
    scripts:{},activeScriptId:null,shootChecklist:chkTemplate('general'),shootDone:{},shootNotes:{},shootReshoot:{},shootGlobalNotes:'',
    venues:[],facts:[],editNotes:[],publish:{titles:[],description:'',coverText:'',pinnedComment:'',audienceQuestions:'',shortIdeas:'',chapters:''}};
}
function defaultState(){return{schemaVersion:SV,appVersion:AV,createdAt:now(),updatedAt:now(),projects:[newProject('Мой первый выпуск')],ideas:[],prompts:{}}}
function migrateProject(p){
  if(!p||typeof p!=='object'||Array.isArray(p))throw new Error('Некорректный проект');
  if(!p.id)p.id=uid();
  if(typeof p.title!=='string')p.title='Новый выпуск';
  if(!PS.includes(p.status))p.status='идея';
  if(!p.createdAt)p.createdAt=now();if(!p.updatedAt)p.updatedAt=p.createdAt;
  const emptyConcept={goal:'',question:'',intrigue:'',path:'',keyEvents:'',successCriteria:'',conditions:'',problems:'',facts:''};
  p.concept={...emptyConcept,...(p.concept&&typeof p.concept==='object'?p.concept:{})};
  if(!p.scripts||typeof p.scripts!=='object'||Array.isArray(p.scripts))p.scripts={};
  Object.entries(p.scripts).forEach(([key,s])=>{
    if(!s||typeof s!=='object')s={};
    s.id=s.id||key||uid();s.title=typeof s.title==='string'?s.title:'Сценарий';
    s.tone=s.tone||'живой';s.createdAt=s.createdAt||now();
    if(!Array.isArray(s.scenes))s.scenes=[];
    s.scenes=s.scenes.filter(x=>x&&typeof x==='object').map(x=>({id:x.id||uid(),title:x.title||'Новая сцена',goal:'',duration:'',hostSays:'',hostAction:'',operator:'',general:'',medium:'',closeups:'',broll:'',reactions:'',transition:'',props:'',risks:'',sound:'',...x}));
    p.scripts[key]=s;
  });
  if(!p.activeScriptId||!p.scripts[p.activeScriptId])p.activeScriptId=Object.keys(p.scripts)[0]||null;
  for(const k of ['venues','facts','editNotes'])if(!Array.isArray(p[k]))p[k]=[];
  if(!Array.isArray(p.shootChecklist))p.shootChecklist=chkTemplate('general');
  p.shootChecklist=p.shootChecklist.filter(x=>x&&typeof x==='object').map(x=>({id:x.id||uid(),text:String(x.text||''),done:!!x.done}));
  for(const k of ['shootDone','shootNotes','shootReshoot'])if(!p[k]||typeof p[k]!=='object'||Array.isArray(p[k]))p[k]={};
  if(typeof p.shootGlobalNotes!=='string')p.shootGlobalNotes='';
  p.publish={titles:[],description:'',coverText:'',pinnedComment:'',audienceQuestions:'',shortIdeas:'',chapters:'',...(p.publish&&typeof p.publish==='object'?p.publish:{})};
  if(!Array.isArray(p.publish.titles))p.publish.titles=[];
  return p;
}
function migrate(d){
  if(!d||typeof d!=='object'||Array.isArray(d))throw new Error('Некорректная база данных');
  if(Number(d.schemaVersion)>SV)throw new Error('Файл новее');
  d.schemaVersion=SV;d.appVersion=d.appVersion||AV;
  d.projects=Array.isArray(d.projects)?d.projects:[];d.projects=d.projects.map(migrateProject);
  d.ideas=Array.isArray(d.ideas)?d.ideas.filter(i=>i&&typeof i==='object').map(i=>({...i,id:i.id||uid(),title:String(i.title||'Без названия'),concept:String(i.concept||''),status:i.status||'Новая',createdAt:i.createdAt||now()})):[];
  d.prompts=d.prompts&&typeof d.prompts==='object'&&!Array.isArray(d.prompts)?d.prompts:{};
  if(!d.projects.length)d.projects=[newProject('Мой первый выпуск')];
  return d;
}

/* --- storage --- */
const storage=(()=>{
  let dbP=null,idbOk=null,lsOk=null;
  function checkLS(){if(lsOk!==null)return lsOk;try{const k='__sht';localStorage.setItem(k,'1');localStorage.removeItem(k);lsOk=true}catch(_){lsOk=false}return lsOk}
  function openDB(){
    if(dbP)return dbP;
    if(!('indexedDB'in window)){dbP=Promise.reject(new Error('no idb'));return dbP}
    dbP=new Promise((res,rej)=>{
      let s=false;const t=setTimeout(()=>{if(!s){s=true;rej(new Error('idb timeout'))}},3000);
      try{const r=indexedDB.open(IDB,1);
        r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(ST))db.createObjectStore(ST)};
        r.onsuccess=()=>{if(!s){s=true;clearTimeout(t);res(r.result)}};
        r.onerror=()=>{if(!s){s=true;clearTimeout(t);rej(r.error)}};
        r.onblocked=()=>{if(!s){s=true;clearTimeout(t);rej(new Error('idb blocked'))}};
      }catch(e){if(!s){s=true;clearTimeout(t);rej(e)}}
    });
    return dbP;
  }
  async function get(){
    try{const db=await openDB();
      const r=await new Promise((res,rej)=>{const tx=db.transaction(ST,'readonly');const g=tx.objectStore(ST).get(KY);g.onsuccess=()=>res(g.result||null);g.onerror=()=>rej(g.error)});
      idbOk=true;return r;
    }catch(e){idbOk=false;console.warn('idb fail:',e.message)}
    if(checkLS()){try{const raw=localStorage.getItem(LS);return raw?JSON.parse(raw):null}catch(e){console.warn('ls read:',e.message)}}
    return null;
  }
  async function set(d){
    if(idbOk!==false){
      try{const db=await openDB();
        await new Promise((res,rej)=>{const tx=db.transaction(ST,'readwrite');tx.objectStore(ST).put(d,KY);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)});
        storageMode='idb';
        if(checkLS()){try{localStorage.setItem(LS,JSON.stringify(d))}catch(_){}}
        return 'idb';
      }catch(e){idbOk=false;console.warn('idb write fail:',e.message)}
    }
    if(checkLS()){try{localStorage.setItem(LS,JSON.stringify(d));storageMode='ls';return 'ls'}catch(e){console.warn('ls write:',e.message)}}
    storageMode='memory';return 'memory';
  }
  return{get,set,isPersistent:()=>storageMode==='idb'||storageMode==='ls',mode:()=>storageMode};
})();

async function persist(){
  setSv('saving');state.updatedAt=now();
  try{const m=await storage.set(state);
    if(m==='memory'){setSv('error');if(!persistWarned){persistWarned=true;toast('Браузер не сохраняет. Делай экспорт!','err')}}
    else setSv('saved');
    queueCloudSave();
  }catch(e){console.error(e);setSv('error')}
}

  const md=user&&user.user_metadata||{};
  return String(md.username||md.display_name||'Аккаунт').trim()||'Аккаунт';
}
function updateCloudButton(){
  const b=$('btn-cloud'); if(!b)return;
  if(sbUser){const nick=profileNick();b.textContent='☁️ '+nick;b.title='Профиль: '+nick+' · нажмите для настроек'}
  else {b.textContent='☁️ Войти';b.title='Вход, регистрация и облачная синхронизация'}
}
function cloudErrorMessage(e){
  const m=(e&&e.message)||String(e||'Неизвестная ошибка');
  if(/row-level security|permission denied|policy/i.test(m)) return 'Supabase отклонил запрос. Проверь RLS-политики таблицы user_workspaces.';
  if(/Failed to fetch|NetworkError|fetch/i.test(m)) return 'Нет соединения с Supabase. Проверь интернет и настройки проекта.';
  return m;
}

    return;

    <div class="field"><label for="cloud-email">Электронная почта</label><input id="cloud-email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
    <div class="field"><label for="cloud-password">Пароль</label><input id="cloud-password" type="password" autocomplete="current-password" placeholder="Не менее 6 символов" minlength="6" required></div>
    <div id="cloud-auth-msg" class="mut" style="margin:8px 0"></div>

    <p class="mut" style="font-size:12px;margin-top:12px">Если в Supabase включено подтверждение почты, после регистрации проверьте входящие письма.</p>`);

    const email=$('cloud-email').value.trim(),password=$('cloud-password').value;

    if(!email||!password){msg.textContent='Укажите почту и пароль.';return}

async function initCloud(){
  try{
    if(!window.supabase||!window.supabase.createClient)throw new Error('Не удалось загрузить клиент Supabase. Проверьте подключение к интернету.');
    sbClient=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    const {data,error}=await sbClient.auth.getSession();if(error)throw error;
    sbUser=data.session?.user||null;
    sbClient.auth.onAuthStateChange((_event,session)=>{
      sbUser=session?.user||null;updateCloudButton();
    });
    updateCloudButton();
  }catch(e){console.error('Supabase init:',e);const b=$('btn-cloud');if(b){b.textContent='☁️ Ошибка';b.title=cloudErrorMessage(e)}}
}
function queueCloudSave(){
  if(!sbUser||!sbClient||!state)return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(()=>cloudSaveNow(false),1200);
}
async function cloudSaveNow(showMessage){
  if(!sbUser||!sbClient||!state){if(showMessage)toast('Сначала войдите в аккаунт.','err');return}
  if(cloudBusy){cloudQueued=true;return}
  cloudBusy=true;
  try{
    const payload={user_id:sbUser.id,app_state:state,updated_at:now()};
    const {error}=await sbClient.from(SB_TABLE).upsert(payload,{onConflict:'user_id'});
    if(error)throw error;
    if(showMessage)toast('Данные отправлены в облако','ok');
  }catch(e){console.error('Cloud save:',e);if(showMessage)toast('Не удалось сохранить: '+cloudErrorMessage(e),'err');else console.warn('Cloud sync failed:',cloudErrorMessage(e))}
  finally{cloudBusy=false;if(cloudQueued){cloudQueued=false;queueCloudSave()}}
}
async function cloudLoadNow(showMessage){
  if(!sbUser||!sbClient)return;
  setCloudLoading(true);
  try{
    const {data,error}=await sbClient.from(SB_TABLE).select('app_state,updated_at').eq('user_id',sbUser.id).maybeSingle();
    if(error)throw error;
    if(!data||!data.app_state){
      await cloudSaveNow(false);
      if(showMessage)toast('В облаке пока не было данных. Текущие данные отправлены туда.','ok');
      return;
    }
    const incoming=migrate(data.app_state);
    state=incoming;pid=state.projects[0]?.id||null;
    await storage.set(state);render();
    if(showMessage)toast('Данные загружены из облака','ok');
  }catch(e){console.error('Cloud load:',e);toast('Не удалось загрузить: '+cloudErrorMessage(e),'err')}
  finally{setCloudLoading(false)}
}
async function afterCloudLogin(){
  try{
    const {data,error}=await sbClient.from(SB_TABLE).select('app_state,updated_at').eq('user_id',sbUser.id).maybeSingle();
    if(error)throw error;
    if(data&&data.app_state){
      modal('Данные в облаке найдены',`<p>Для профиля <b>${esc(profileNick())}</b> уже есть сохранённое рабочее пространство.</p>
        <p>Что сделать с данными этого браузера?</p>
        <div class="row" style="margin-top:14px">
          <button class="btn pri" id="cloud-use-remote">Загрузить из облака</button>
          <button class="btn" id="cloud-use-local">Оставить локальные и отправить в облако</button>
        </div><p class="mut" style="font-size:12px;margin-top:10px">Выбор «отправить в облако» заменит облачную копию текущими локальными данными.</p>`);
      $('cloud-use-remote').onclick=async()=>{closeModal();await cloudLoadNow(true)};
      $('cloud-use-local').onclick=async()=>{closeModal();await cloudSaveNow(true)};
    }else{
      await cloudSaveNow(false);
      toast('Аккаунт подключён. Данные сохранены в облако.','ok');
    }
  }catch(e){console.error('Cloud account:',e);toast('Аккаунт подключён, но синхронизация не удалась: '+cloudErrorMessage(e),'err')}
}

async function loadState(){
  let d=null;
  try{d=await storage.get()}catch(e){console.error('read fail:',e)}
  if(d&&d.schemaVersion&&Array.isArray(d.projects)&&d.projects.length){
    try{state=migrate(d)}catch(e){console.error('migrate fail:',e);state=defaultState()}
  }else state=defaultState();
  try{await storage.set(state)}catch(_){}
}

/* --- accessors --- */
function proj(id){const x=id||pid;let p=state.projects.find(q=>q.id===x);if(!p){p=state.projects[0];pid=p.id}return p}
function activeScript(p){const a=Object.values(p.scripts||{});if(!a.length)return null;return p.scripts[p.activeScriptId]||a[0]}
function findScene(p,sid){for(const s of Object.values(p.scripts||{})){const sc=(Array.isArray(s.scenes)?s.scenes:[]).find(x=>x.id===sid);if(sc)return sc}return null}

function upcoming(p){

function saveDeepSeek(raw){
  const txt=$('g-answer').value.trim();if(!txt){toast('Пустой ответ','err');return}
  let blocks=[];
  if(!raw){
    const re=/(^|\n)\s*Идея\s+\d+\s*[:\-—]/gi;const idx=[];let m;
    while((m=re.exec(txt))!==null)idx.push(m.index+(m[1]?m[1].length:0));
    if(idx.length){for(let k=0;k<idx.length;k++){const a=idx[k];const b=k+1<idx.length?idx[k+1]:txt.length;blocks.push(txt.slice(a,b).trim())}}
    else blocks=[txt];
  }else blocks=[txt];
  let c=0;
  blocks.forEach((b,i)=>{
    const pr=parseIdea(b,i+1);
    state.ideas.push({id:uid(),title:pr.title,concept:pr.short,format:$('g-format').value,audience:'',hook:pr.hook,intrigue:pr.why,challenges:pr.whatInFrame,shots:pr.operator,duration:$('g-duration').value,budget:$('g-budget').value,materials:pr.equipment,risks:pr.risks,factsToCheck:pr.toCheck,status:'Новая',createdAt:now(),notes:b});
    c++;
  });
  persist();toast(`Сохранено: ${c}`,'ok');$('g-answer').value='';setView('ideas');
}
function parseIdea(b,n){
  const o={};const tm=b.match(/Идея\s*\d+\s*[:\-—]\s*(.+)/i);
  o.title=tm?tm[1].trim().split('\n')[0]:`Идея ${n}`;
  const g=k=>{const re=new RegExp(k+'\\)\\s*([\\s\\S]*?)(?=\\n\\s*\\d+\\)|$)','i');const m=b.match(re);return m?m[1].trim():''};
  o.short=g(2)||g(1);o.hook=g(3);o.why=g(4);o.whatInFrame=g(5);o.operator=g(7);o.equipment=g(8);o.risks=g(10);o.toCheck=g(11);
  return o;
}

}

/* --- rating --- */
function calcVenue(v){
  const c=v.criteria||DC,s=v.scores||{};let sum=0,w=0;
  c.forEach(x=>{sum+=(+s[x.id]||0)*(+x.weight||1);w+=+x.weight||1});
  const t=w?sum/w:0;
  const eq=c.every(x=>(+x.weight||1)===(+c[0].weight||1));
  return{total:Math.round(t*100)/100,formula:eq?`Равные веса: (${c.map(x=>s[x.id]||0).join(' + ')}) / ${c.length}`:'Взвешенное среднее: Σ(оценка × вес) / Σвесов'};
}
