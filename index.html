<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Sport Hub — РАЗГИЛЬДЯИ</title>
<style>
:root{--bg:#0e1116;--pnl:#161b23;--pnl2:#1d232d;--ln:#262e3a;--tx:#e7ecf3;--mt:#8d98a8;--ac:#ffd400;--ac2:#ff5b2e;--ok:#3ddc84;--wn:#ffb020;--bd:#ff5b5b;--r:12px;--tap:44px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Respect the HTML hidden attribute even for elements with explicit display styles. */
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
button{font-family:inherit}
#app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:64px 1fr;grid-template-areas:"top top" "nav main";min-height:100vh;min-height:100dvh}
.topbar{grid-area:top;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--pnl);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-weight:900;color:#111;font-size:16px}
.bn-nm{font-weight:800;font-size:16px}.bn-sb{font-size:12px;color:var(--mt)}
.topbar-actions{display:flex;gap:8px}
.sidenav{grid-area:nav;background:var(--pnl);border-right:1px solid var(--ln);padding:12px 8px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;position:sticky;top:64px;height:calc(100vh - 64px)}
.nav-item{background:0;border:0;color:var(--tx);text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px;display:flex;gap:8px;align-items:center}
.nav-item:hover{background:var(--pnl2)}.nav-item.active{background:var(--ac);color:#111;font-weight:700}
#main{grid-area:main;padding:20px 24px;overflow-y:auto;min-width:0}
.bottomnav{display:none}
h1{font-size:22px;margin:0 0 12px}h2{font-size:18px;margin:20px 0 12px}h3{margin:0 0 12px}
.mut{color:var(--mt)}
.btn{background:var(--pnl2);color:var(--tx);border:1px solid var(--ln);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;min-height:36px}
.btn:hover{background:#242c38}
.btn.pri{background:var(--ac);color:#111;border-color:var(--ac)}.btn.pri:hover{filter:brightness(1.08)}
.btn.dng{background:#3a1a1a;color:#ffb3b3;border-color:#552}
.btn.gho{background:0}.btn.sm{padding:4px 10px;font-size:12px;min-height:28px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,textarea,select{background:var(--pnl2);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit;width:100%;min-height:36px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--ac);border-color:transparent}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:12px;color:var(--mt);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.field{margin-bottom:12px}
.grid{display:grid;gap:16px}.c2{grid-template-columns:repeat(2,1fr)}.c3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--pnl);border:1px solid var(--ln);border-radius:var(--r);padding:16px}
.card h3{margin-top:0}
.crow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bdg{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;background:var(--pnl2);color:var(--mt);border:1px solid var(--ln)}
.bdg.ok{color:var(--ok);border-color:#1d3a2a;background:#12261c}
.bdg.wn{color:var(--wn);border-color:#3a2f1a;background:#26200f}
.bdg.bd{color:var(--bd);border-color:#3a1d1d;background:#261414}
.bdg.ac{color:#111;background:var(--ac);border-color:var(--ac)}
.empty{text-align:center;padding:40px;color:var(--mt)}
.list{display:flex;flex-direction:column;gap:10px}
.li{background:var(--pnl);border:1px solid var(--ln);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.li.ck{cursor:pointer}.li.ck:hover{border-color:var(--ac)}
.prg{height:8px;background:var(--pnl2);border-radius:6px;overflow:hidden}
.prg>div{height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .3s}
.rs{display:flex;gap:6px;flex-wrap:wrap}
.rs button{width:var(--tap);height:var(--tap);border-radius:8px;border:1px solid var(--ln);background:var(--pnl2);color:var(--tx);cursor:pointer;font-size:14px;font-weight:600}
.rs button.on{background:var(--ac);color:#111;border-color:var(--ac)}
.scene{background:var(--pnl);border:1px solid var(--ln);border-radius:12px;margin-bottom:12px;overflow:hidden}
.sh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--pnl2);cursor:pointer;gap:8px;flex-wrap:wrap}
.sh:hover{background:#222a36}
.sb{padding:14px;display:none}.scene.open .sb{display:block}
.sn{background:var(--ac);color:#111;font-weight:800;border-radius:6px;padding:2px 8px;font-size:12px;margin-right:8px}
.st{font-weight:700;flex:1;min-width:0}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac);flex-shrink:0}
.done{text-decoration:line-through;color:var(--mt)}
pre.prompt{background:#0a0d12;border:1px solid var(--ln);border-radius:8px;padding:12px;white-space:pre-wrap;word-break:break-word;font-size:13px;max-height:340px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222a36;border:1px solid var(--ln);padding:10px 18px;border-radius:10px;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.4);max-width:calc(100vw - 32px)}
.toast.err{border-color:var(--bd);color:#ffb3b3}.toast.ok{border-color:var(--ok);color:#b8f0d0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:grid;place-items:center;z-index:200;padding:20px}
.mc{background:var(--pnl);border:1px solid var(--ln);border-radius:14px;padding:20px;max-width:640px;width:100%;max-height:85vh;overflow-y:auto}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.mh h3{margin:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kc{background:var(--pnl);border:1px solid var(--ln);border-radius:12px;padding:14px}
.kl{font-size:12px;color:var(--mt);text-transform:uppercase;letter-spacing:.5px}
.kv{font-size:24px;font-weight:800;margin-top:4px}
.sv{position:fixed;right:14px;bottom:14px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:14px;color:var(--mt);background:var(--pnl);border:1px solid var(--ln);z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.sv.show{opacity:1}.sv.saving{color:var(--wn)}.sv.saved{color:var(--ok)}.sv.error{color:var(--bd)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:flex;align-items:flex-end}
.sc{background:var(--pnl);border-radius:16px 16px 0 0;width:100%;max-height:80vh;overflow-y:auto;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.sgh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sgg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sgg button{background:var(--pnl2);border:1px solid var(--ln);color:var(--tx);padding:14px 10px;border-radius:10px;cursor:pointer;text-align:left;font-size:13px;min-height:var(--tap)}
.sgf{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--ln)}
.sgf .btn{width:100%;min-height:var(--tap)}
.sc2{background:var(--pnl);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}
.shd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sti{font-size:18px;font-weight:800;line-height:1.25}
.snm{background:var(--ac);color:#111;font-weight:800;border-radius:8px;padding:3px 10px;font-size:13px;white-space:nowrap}
.sb2{margin-bottom:14px}.sb2 label{display:block;font-size:11px;color:var(--mt);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.sv2{font-size:15px;line-height:1.45}.sv2.sm{font-size:14px}
.sac{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sac .btn{min-height:var(--tap);font-size:14px}
.snv{display:flex;gap:8px;margin:0 0 12px}.snv .btn{flex:1;min-height:var(--tap)}
.snt{width:100%;min-height:70px;font-size:15px}
.drop{border:2px dashed var(--ln);border-radius:12px;padding:24px;text-align:center;cursor:pointer;transition:border-color .2s}
.drop:hover,.drop.over{border-color:var(--ac);background:rgba(255,212,0,.05)}
@media (max-width:820px){
  #app{grid-template-columns:1fr;grid-template-rows:56px 1fr 64px;grid-template-areas:"top" "main" "bnav";padding-bottom:env(safe-area-inset-bottom)}
  .topbar{padding:0 12px}.bn-sb{display:none}
  .topbar-actions .btn{padding:6px 10px;font-size:12px;min-height:32px}
  .sidenav{display:none}
  #main{padding:12px 12px 20px}
  .c2,.c3{grid-template-columns:1fr}
  h1{font-size:19px}h2{font-size:16px;margin-top:16px}
  .card{padding:14px}
  .bottomnav{grid-area:bnav;display:grid;grid-template-columns:repeat(5,1fr);background:var(--pnl);border-top:1px solid var(--ln);position:sticky;bottom:0;z-index:60;padding-bottom:env(safe-area-inset-bottom)}
  .bn-item{background:0;border:0;color:var(--mt);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 0;cursor:pointer;font-size:11px}
  .bn-item span{font-size:20px;line-height:1}.bn-item small{font-size:10px}
  .bn-item.active{color:var(--ac)}
  .sv{bottom:76px;right:12px}
  .chk{padding:12px 0}.chk input[type=checkbox]{width:26px;height:26px}
  .sh{padding:14px}
}
@media print{.topbar,.sidenav,.bottomnav,.sv,.btn{display:none!important}#app{display:block}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="logo">SH</span><div><div class="bn-nm">Sport Hub</div><div class="bn-sb">РАЗГИЛЬДЯИ · Спорт без лишнего пафоса</div></div></div>
    <div class="topbar-actions">
      <button class="btn gho" id="btn-goto-data" title="Экспорт / Импорт / Хранение">📦 Данные</button>
      <button class="btn gho" id="btn-help" title="Справка">?</button>
    </div>
  </header>
  <nav class="sidenav">
    <button class="nav-item active" data-view="dashboard">📊 Панель</button>
    <button class="nav-item" data-view="projects">🗂 Проекты</button>
    <button class="nav-item" data-view="ideas">💡 Банк идей</button>
    <button class="nav-item" data-view="generator">🤖 Генератор</button>
    <button class="nav-item" data-view="concept">🧭 Концепция</button>
    <button class="nav-item" data-view="script">🎬 Сценарий</button>
    <button class="nav-item" data-view="shoot">📹 Съёмка</button>
    <button class="nav-item" data-view="rating">⭐ Рейтинг</button>
    <button class="nav-item" data-view="facts">🔍 Факты</button>
    <button class="nav-item" data-view="editnotes">✂️ Монтаж</button>
    <button class="nav-item" data-view="publish">📤 Публикация</button>
    <button class="nav-item" data-view="prompts">📚 Промпты</button>
    <button class="nav-item" data-view="data">📦 Данные</button>
  </nav>
  <main id="main"></main>
  <nav class="bottomnav">
    <button class="bn-item active" data-view="dashboard"><span>📊</span><small>Панель</small></button>
    <button class="bn-item" data-view="ideas"><span>💡</span><small>Идеи</small></button>
    <button class="bn-item" data-view="script"><span>🎬</span><small>Сценарий</small></button>
    <button class="bn-item" data-view="shoot"><span>📹</span><small>Съёмка</small></button>
    <button class="bn-item" data-view="more"><span>☰</span><small>Ещё</small></button>
  </nav>
  <div class="sheet" id="more-sheet" hidden><div class="sc"><div class="sgh"><h3>Все разделы</h3><button class="btn gho" id="sheet-close">✕</button></div><div class="sgg" id="sheet-grid"></div></div></div>
  <div id="toast" class="toast" hidden></div>
  <div id="modal" class="modal" hidden><div class="mc"><div class="mh"><h3 id="modal-title"></h3><button class="btn gho" id="modal-close">✕</button></div><div id="modal-body"></div></div></div>
  <div id="savestatus" class="sv" title="Сохранение">●</div>
</div>
<script>
'use strict';
/* ============================================================
   Sport Hub 2.3
   КЛЮЧЕВОЕ: НЕТ input[type=file] В HTML.
   Импорт файла создаётся только когда пользователь нажмёт
   "Выбрать файл" в разделе "📦 Данные".
   ============================================================ */
const SV=3,AV='2.3.0',IDB='sporthub_db',ST='appstate',KY='root',LS='sporthub_v3';
const PS=['идея','подготовка','сценарий готов','готов к съёмке','съёмка начата','съёмка завершена','монтаж','готов к публикации','опубликован'];
const IF=['обзор спортивной площадки','пробуем новый вид спорта','рейтинги и сравнения','спортивные челленджи','необычные спортивные активности','бюджетный спорт','места для тренировок','личный опыт','эксперименты','короткие видео и Shorts','пользовательские идеи'];
const IS=['Новая','На рассмотрении','Выбрана','В подготовке','Снята','Опубликована','Отложена'];
const FS=['Не проверено','Подтверждено','Нужно уточнить','Не использовать'];
const DC=[{id:'safety',name:'Безопасность оборудования',weight:1},{id:'variety',name:'Разнообразие',weight:1},{id:'access',name:'Удобство',weight:1},{id:'clean',name:'Чистота',weight:1},{id:'atmo',name:'Атмосфера',weight:1},{id:'overall',name:'Общее впечатление',weight:1}];

let state=null,view='dashboard',pid=null,storageMode='unknown',shootIdx=0,ideaFilter={format:'',status:'',q:''},persistWarned=false;

const $=id=>document.getElementById(id);
const uid=()=>'i-'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n2b=s=>esc(s).replace(/\n/g,'<br>');
const now=()=>new Date().toISOString();
const fmt=d=>{try{return new Date(d).toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'})}catch(_){return d||''}};
const touch=p=>{if(p)p.updatedAt=now()};

function toast(m,k){const el=$('toast');if(!el)return;el.textContent=m;el.className='toast '+(k||'');el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2600)}
function modal(t,h){$('modal-title').textContent=t;$('modal-body').innerHTML=h;$('modal').hidden=false}
function closeModal(){$('modal').hidden=true}
function setSv(k){const el=$('savestatus');if(!el)return;el.classList.add('show');el.classList.remove('saving','saved','error');if(k==='saving'){el.textContent='⏳';el.classList.add('saving')}else if(k==='saved'){el.textContent='●';el.classList.add('saved');clearTimeout(setSv._t);setSv._t=setTimeout(()=>el.classList.remove('show'),1200)}else if(k==='error'){el.textContent='!';el.classList.add('error')}}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(_){try{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}catch(_){return false}}}

/* --- checklist --- */
function chkTemplate(kind){
  const b=['Внешний вид и состояние площадки/места','Общий план места','Ведущий в кадре','Крупные планы оборудования','Детали и особенности','Процесс тестирования','Реакции ведущего','Плюсы','Минусы','Перебивки','Чистый звук','Запасные дубли','Финальная оценка','Заключительный кадр'];
  if(kind==='venue')b.push('Парковка/вход','Режим работы, цены','Туалеты/раздевалки','Посетители');
  if(kind==='sport')b.push('Экипировка и правила','Первые попытки','Прогресс','Сравнение с ожиданиями');
  return b.map(t=>({id:uid(),text:t,done:false}));
}

/* --- project --- */
function newProject(title){
  const n=now();
  return{id:uid(),title:title||'Новый выпуск',status:'идея',createdAt:n,updatedAt:n,ideaId:null,
    concept:{goal:'',question:'',intrigue:'',path:'',keyEvents:'',successCriteria:'',conditions:'',problems:'',facts:''},
    scripts:{},activeScriptId:null,shootChecklist:chkTemplate('general'),shootDone:{},shootNotes:{},shootReshoot:{},shootGlobalNotes:'',
    venues:[],facts:[],editNotes:[],publish:{titles:[],description:'',coverText:'',pinnedComment:'',audienceQuestions:'',shortIdeas:'',chapters:''}};
}
function defaultState(){return{schemaVersion:SV,appVersion:AV,createdAt:now(),updatedAt:now(),projects:[newProject('Мой первый выпуск')],ideas:[],prompts:{}}}
function migrateProject(p){
  if(!p||typeof p!=='object'||Array.isArray(p))throw new Error('Некорректный проект');
  if(!p.id)p.id=uid();
  if(typeof p.title!=='string')p.title='Новый выпуск';
  if(!PS.includes(p.status))p.status='идея';
  if(!p.createdAt)p.createdAt=now();if(!p.updatedAt)p.updatedAt=p.createdAt;
  const emptyConcept={goal:'',question:'',intrigue:'',path:'',keyEvents:'',successCriteria:'',conditions:'',problems:'',facts:''};
  p.concept={...emptyConcept,...(p.concept&&typeof p.concept==='object'?p.concept:{})};
  if(!p.scripts||typeof p.scripts!=='object'||Array.isArray(p.scripts))p.scripts={};
  Object.entries(p.scripts).forEach(([key,s])=>{
    if(!s||typeof s!=='object')s={};
    s.id=s.id||key||uid();s.title=typeof s.title==='string'?s.title:'Сценарий';
    s.tone=s.tone||'живой';s.createdAt=s.createdAt||now();
    if(!Array.isArray(s.scenes))s.scenes=[];
    s.scenes=s.scenes.filter(x=>x&&typeof x==='object').map(x=>({id:x.id||uid(),title:x.title||'Новая сцена',goal:'',duration:'',hostSays:'',hostAction:'',operator:'',general:'',medium:'',closeups:'',broll:'',reactions:'',transition:'',props:'',risks:'',sound:'',...x}));
    p.scripts[key]=s;
  });
  if(!p.activeScriptId||!p.scripts[p.activeScriptId])p.activeScriptId=Object.keys(p.scripts)[0]||null;
  for(const k of ['venues','facts','editNotes'])if(!Array.isArray(p[k]))p[k]=[];
  if(!Array.isArray(p.shootChecklist))p.shootChecklist=chkTemplate('general');
  p.shootChecklist=p.shootChecklist.filter(x=>x&&typeof x==='object').map(x=>({id:x.id||uid(),text:String(x.text||''),done:!!x.done}));
  for(const k of ['shootDone','shootNotes','shootReshoot'])if(!p[k]||typeof p[k]!=='object'||Array.isArray(p[k]))p[k]={};
  if(typeof p.shootGlobalNotes!=='string')p.shootGlobalNotes='';
  p.publish={titles:[],description:'',coverText:'',pinnedComment:'',audienceQuestions:'',shortIdeas:'',chapters:'',...(p.publish&&typeof p.publish==='object'?p.publish:{})};
  if(!Array.isArray(p.publish.titles))p.publish.titles=[];
  return p;
}
function migrate(d){
  if(!d||typeof d!=='object'||Array.isArray(d))throw new Error('Некорректная база данных');
  if(Number(d.schemaVersion)>SV)throw new Error('Файл новее');
  d.schemaVersion=SV;d.appVersion=d.appVersion||AV;
  d.projects=Array.isArray(d.projects)?d.projects:[];d.projects=d.projects.map(migrateProject);
  d.ideas=Array.isArray(d.ideas)?d.ideas.filter(i=>i&&typeof i==='object').map(i=>({...i,id:i.id||uid(),title:String(i.title||'Без названия'),concept:String(i.concept||''),status:i.status||'Новая',createdAt:i.createdAt||now()})):[];
  d.prompts=d.prompts&&typeof d.prompts==='object'&&!Array.isArray(d.prompts)?d.prompts:{};
  if(!d.projects.length)d.projects=[newProject('Мой первый выпуск')];
  return d;
}

/* --- storage --- */
const storage=(()=>{
  let dbP=null,idbOk=null,lsOk=null;
  function checkLS(){if(lsOk!==null)return lsOk;try{const k='__sht';localStorage.setItem(k,'1');localStorage.removeItem(k);lsOk=true}catch(_){lsOk=false}return lsOk}
  function openDB(){
    if(dbP)return dbP;
    if(!('indexedDB'in window)){dbP=Promise.reject(new Error('no idb'));return dbP}
    dbP=new Promise((res,rej)=>{
      let s=false;const t=setTimeout(()=>{if(!s){s=true;rej(new Error('idb timeout'))}},3000);
      try{const r=indexedDB.open(IDB,1);
        r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(ST))db.createObjectStore(ST)};
        r.onsuccess=()=>{if(!s){s=true;clearTimeout(t);res(r.result)}};
        r.onerror=()=>{if(!s){s=true;clearTimeout(t);rej(r.error)}};
        r.onblocked=()=>{if(!s){s=true;clearTimeout(t);rej(new Error('idb blocked'))}};
      }catch(e){if(!s){s=true;clearTimeout(t);rej(e)}}
    });
    return dbP;
  }
  async function get(){
    try{const db=await openDB();
      const r=await new Promise((res,rej)=>{const tx=db.transaction(ST,'readonly');const g=tx.objectStore(ST).get(KY);g.onsuccess=()=>res(g.result||null);g.onerror=()=>rej(g.error)});
      idbOk=true;return r;
    }catch(e){idbOk=false;console.warn('idb fail:',e.message)}
    if(checkLS()){try{const raw=localStorage.getItem(LS);return raw?JSON.parse(raw):null}catch(e){console.warn('ls read:',e.message)}}
    return null;
  }
  async function set(d){
    if(idbOk!==false){
      try{const db=await openDB();
        await new Promise((res,rej)=>{const tx=db.transaction(ST,'readwrite');tx.objectStore(ST).put(d,KY);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)});
        storageMode='idb';
        if(checkLS()){try{localStorage.setItem(LS,JSON.stringify(d))}catch(_){}}
        return 'idb';
      }catch(e){idbOk=false;console.warn('idb write fail:',e.message)}
    }
    if(checkLS()){try{localStorage.setItem(LS,JSON.stringify(d));storageMode='ls';return 'ls'}catch(e){console.warn('ls write:',e.message)}}
    storageMode='memory';return 'memory';
  }
  return{get,set,isPersistent:()=>storageMode==='idb'||storageMode==='ls',mode:()=>storageMode};
})();

async function persist(){
  setSv('saving');state.updatedAt=now();
  try{const m=await storage.set(state);
    if(m==='memory'){setSv('error');if(!persistWarned){persistWarned=true;toast('Браузер не сохраняет. Делай экспорт!','err')}}
    else setSv('saved');
  }catch(e){console.error(e);setSv('error')}
}
async function loadState(){
  let d=null;
  try{d=await storage.get()}catch(e){console.error('read fail:',e)}
  if(d&&d.schemaVersion&&Array.isArray(d.projects)&&d.projects.length){
    try{state=migrate(d)}catch(e){console.error('migrate fail:',e);state=defaultState()}
  }else state=defaultState();
  try{await storage.set(state)}catch(_){}
}

/* --- accessors --- */
function proj(id){const x=id||pid;let p=state.projects.find(q=>q.id===x);if(!p){p=state.projects[0];pid=p.id}return p}
function activeScript(p){const a=Object.values(p.scripts||{});if(!a.length)return null;return p.scripts[p.activeScriptId]||a[0]}
function findScene(p,sid){for(const s of Object.values(p.scripts||{})){const sc=(Array.isArray(s.scenes)?s.scenes:[]).find(x=>x.id===sid);if(sc)return sc}return null}

function upcoming(p){
  const it=[];
  if(!p.concept||!p.concept.goal)it.push('Заполнить концепцию');

  if(!p.facts.length)it.push('Добавить факты');
  if(p.status!=='опубликован'&&!p.publish.description)it.push('Описание YouTube');
  return it.length?'<ul style="margin:8px 0 0 18px">'+it.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>':'<p class="mut">Всё главное сделано.</p>';
}

function createProject(){
  const n=prompt('Название:','Новый выпуск');if(n==null)return;
  const p=newProject(n.trim()||'Новый выпуск');state.projects.push(p);pid=p.id;persist();render();toast('Создан','ok');
}
function dupProject(id){
  const s=state.projects.find(p=>p.id===id);if(!s)return;
  const c=JSON.parse(JSON.stringify(s));c.id=uid();c.title=s.title+' (копия)';c.createdAt=now();c.updatedAt=now();
  state.projects.push(c);persist();render();toast('Дублировано','ok');
}
function delProject(id){
  if(state.projects.length<=1){toast('Нельзя удалить последний','err');return}
  if(!confirm('Удалить?'))return;
  state.projects=state.projects.filter(p=>p.id!==id);
  if(pid===id)pid=state.projects[0].id;
  persist();render();toast('Удалён','ok');
}
function setProjectStatus(id,st){const p=state.projects.find(x=>x.id===id);if(p){p.status=st;touch(p);persist();render()}}

function ideaToScript(id){
  const idea=state.ideas.find(i=>i.id===id);if(!idea)return;
  const p=proj();
  if(p.activeScriptId&&p.scripts[p.activeScriptId]&&!confirm('Сценарий уже есть. Создать ещё один?'))return;

  p.scripts[s.id]=s;p.activeScriptId=s.id;p.ideaId=id;
  if(p.title==='Мой первый выпуск'||p.title==='Новый выпуск')p.title=idea.title;
  touch(p);persist();setView('script');toast('Сценарий создан','ok');
}

    T('Хук','Зацепить','5–15 сек','Резкая реакция','Смотри, куда мы пришли!','Крупный план',['Общий','Вход','Крупный']),
    T('Вступление','Тема','15–30 сек','Объясняет',`Сегодня ${idea.concept||'пробуем'}.`,'Средний + перебивки',['Средний','Перебивки','Детали']),
    T('Место','Локация','20–40 сек','Ходит, комментирует','Смотрите, что тут.','Проходка',['Проходка','Крупные','Общий']),
    T('Проба','Первая попытка','30–60 сек','Пробует','Поехали.','С разных точек',['Начало','Реакция','Детали']),

ВХОД:

Не выдумывай адреса, цены, статистику.`;

function saveDeepSeek(raw){
  const txt=$('g-answer').value.trim();if(!txt){toast('Пустой ответ','err');return}
  let blocks=[];
  if(!raw){
    const re=/(^|\n)\s*Идея\s+\d+\s*[:\-—]/gi;const idx=[];let m;
    while((m=re.exec(txt))!==null)idx.push(m.index+(m[1]?m[1].length:0));
    if(idx.length){for(let k=0;k<idx.length;k++){const a=idx[k];const b=k+1<idx.length?idx[k+1]:txt.length;blocks.push(txt.slice(a,b).trim())}}
    else blocks=[txt];
  }else blocks=[txt];
  let c=0;
  blocks.forEach((b,i)=>{
    const pr=parseIdea(b,i+1);
    state.ideas.push({id:uid(),title:pr.title,concept:pr.short,format:$('g-format').value,audience:'',hook:pr.hook,intrigue:pr.why,challenges:pr.whatInFrame,shots:pr.operator,duration:$('g-duration').value,budget:$('g-budget').value,materials:pr.equipment,risks:pr.risks,factsToCheck:pr.toCheck,status:'Новая',createdAt:now(),notes:b});
    c++;
  });
  persist();toast(`Сохранено: ${c}`,'ok');$('g-answer').value='';setView('ideas');
}
function parseIdea(b,n){
  const o={};const tm=b.match(/Идея\s*\d+\s*[:\-—]\s*(.+)/i);
  o.title=tm?tm[1].trim().split('\n')[0]:`Идея ${n}`;
  const g=k=>{const re=new RegExp(k+'\\)\\s*([\\s\\S]*?)(?=\\n\\s*\\d+\\)|$)','i');const m=b.match(re);return m?m[1].trim():''};
  o.short=g(2)||g(1);o.hook=g(3);o.why=g(4);o.whatInFrame=g(5);o.operator=g(7);o.equipment=g(8);o.risks=g(10);o.toCheck=g(11);
  return o;
}

function calcVenue(v){
  const c=v.criteria||DC,s=v.scores||{};let sum=0,w=0;
  c.forEach(x=>{sum+=(+s[x.id]||0)*(+x.weight||1);w+=+x.weight||1});
  const t=w?sum/w:0;
  const eq=c.every(x=>(+x.weight||1)===(+c[0].weight||1));
  return{total:Math.round(t*100)/100,formula:eq?`Равные веса: (${c.map(x=>s[x.id]||0).join(' + ')}) / ${c.length}`:'Взвешенное среднее: Σ(оценка × вес) / Σвесов'};
}

function publishPrompt(p,mode){
  const s=activeScript(p);
  const sc=s?s.scenes.map((x,i)=>`${i+1}. ${x.title} — ${x.goal||''}`).join('\n'):'—';
  const base=`Продюсер YouTube-канала «РАЗГИЛЬДЯИ». Живой, дружеский, без пафоса.\nПроект: ${p.title}\nКонцепция: ${p.concept.goal||''} ${p.concept.question||''}\nСцены:\n${sc}\n`;
  if(mode==='titles')return base+'\nЗадача: 6–8 названий (40–70 знаков), разные интонации.';
  if(mode==='description')return base+'\nЗадача: описание 3–5 абзацев, первые 2 строки — самые важные.';
  return base+'\nЗадача: пакет публикации — названия, описание, обложка, закреп, вопросы, Shorts, шаблон глав.';
}

}

        <div class="mut" style="font-size:12px;margin:6px 0 12px">или</div>

        <div class="mut" style="font-size:11px;margin-top:8px">.json, до 20 МБ</div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:14px">
    <h3>Что делать на двух устройствах</h3>
    <ol style="margin:8px 0 0 18px;font-size:14px;line-height:1.7">
      <li>На компьютере: работаешь → «⭳ Текущий проект» → файл.</li>
      <li>Передаёшь файл на телефон (мессенджер, USB, облако).</li>
      <li>На телефоне: этот же раздел → «Выбрать файл» → импорт → «Добавить».</li>
      <li>Работаешь в «Съёмке», ставишь заметки.</li>
      <li>Обратно: «⭳ Текущий проект» → файл → на компьютер.</li>
      <li>На компьютере: импорт → «Заменить» (или «Сохранить обе»).</li>
    </ol>
    <p class="mut" style="font-size:12px;margin-top:10px">Автоматического слияния нет. Если сомневаешься, какая версия новее — «Сохранить обе».</p>
  </div>

  <div class="card" style="margin-top:14px">
    <h3>Опасная зона</h3>
    <button class="btn dng" id="data-reset">Сбросить все данные и начать заново</button>
    <p class="mut" style="font-size:12px;margin-top:8px">Удалит все проекты и идеи из этого браузера. Сначала сделай экспорт!</p>
  </div>`;
}
function afterData(){
  $('data-export-project').onclick=()=>exportProject(proj());
  $('data-export-all').onclick=exportAll;
  $('data-pick-file').onclick=()=>pickFile();
  $('data-reset').onclick=()=>{
    if(!confirm('Удалить ВСЕ данные из этого браузера?'))return;
    if(!confirm('Точно? Сначала сделай экспорт, если нужно.'))return;
    if(confirm('Скачать резервную копию перед сбросом?'))exportAll();
    try{
      state=defaultState();pid=state.projects[0].id;
      storage.set(state).catch(()=>{});
      persist();render();toast('Данные сброшены','ok');
    }catch(e){toast('Ошибка: '+e.message,'err')}
  };

  // Dropzone
  const dz=$('dropzone');
  if(dz){
    ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();dz.classList.add('over')}));
    ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();dz.classList.remove('over')}));
    dz.addEventListener('drop',e=>{
      const f=e.dataTransfer.files && e.dataTransfer.files[0];
      if(f) readImportFile(f);
    });
  }
}

/* --- файловый диалог: создаётся ТОЛЬКО здесь, по кнопке --- */
function pickFile(){
  const inp=document.createElement('input');
  inp.type='file';
  inp.accept='.json,application/json';
  // Не добавляем в DOM — современные браузеры это позволяют
  inp.onchange=()=>{
    const f=inp.files && inp.files[0];
    if(f) readImportFile(f);
    inp.value='';
  };
  try{ inp.click(); }
  catch(e){
    // fallback для старых браузеров: временно добавляем в DOM и удаляем
    inp.style.cssText='position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0';
    document.body.appendChild(inp);
    inp.click();
    setTimeout(()=>{ try{inp.remove()}catch(_){} }, 60000);
  }
}
function readImportFile(file){
  if(!file){ toast('Файл не выбран','err'); return; }
  if(file.size > 20*1024*1024){ toast('Файл слишком большой (>20 МБ)','err'); return; }
  const r=new FileReader();
  r.onload=()=>{
    let d;try{d=JSON.parse(r.result)}catch(e){toast('Невалидный JSON: '+e.message,'err');return}
    const errs=validateImport(d);
    if(errs.length){
      modal('Импорт отклонён',`<p class="bdg bd">Файл не прошёл проверку</p><ul style="margin:12px 0 0 18px">${errs.map(e=>`<li>${esc(e)}</li>`).join('')}</ul><p class="mut" style="font-size:13px;margin-top:12px">Данные не изменены.</p><button class="btn" id="imp-err" style="margin-top:12px">Закрыть</button>`);
      $('imp-err').onclick=closeModal;
      return;
    }
    if(d.exportType==='full')importFull(d);else importProjectFlow(d);
  };
  r.onerror=()=>toast('Ошибка чтения файла','err');
  r.readAsText(file);
}

/* --- export --- */
function exportAll(){
  downloadJSON({schemaVersion:SV,appVersion:AV,exportedAt:now(),exportType:'full',projects:state.projects,ideas:state.ideas,prompts:state.prompts},'sporthub-full-');
  toast('Копия скачана','ok');
}
function exportProject(p){
  if(!p){toast('Не найден','err');return}
  const safe=p.title.replace(/[^\wа-яА-ЯёЁ\- ]/g,'').trim().replace(/\s+/g,'_').slice(0,40)||'project';
  downloadJSON({schemaVersion:SV,appVersion:AV,exportedAt:now(),exportType:'project',project:p},'sporthub-'+safe+'-');
  toast('Проект экспортирован','ok');
}
function downloadJSON(obj,prefix){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=prefix+now().slice(0,19).replace(/[:T]/g,'-')+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* --- import --- */
function validateImport(d){
  const e=[];
  if(!d||typeof d!=='object'||Array.isArray(d)){e.push('Файл должен содержать JSON-объект');return e}
  if(typeof d.schemaVersion!=='number'||!Number.isFinite(d.schemaVersion))e.push('Нет корректного schemaVersion');
  else if(d.schemaVersion>SV)e.push(`Файл новее (v${d.schemaVersion})`);
  if(d.exportType==='full'){
    if(!Array.isArray(d.projects)||!d.projects.length)e.push('Нет проектов');
    else if(d.projects.some(p=>!p||typeof p!=='object'||Array.isArray(p)))e.push('Список проектов содержит некорректные элементы');
    if(d.ideas!=null&&!Array.isArray(d.ideas))e.push('Поле ideas должно быть массивом');
    if(d.prompts!=null&&(typeof d.prompts!=='object'||Array.isArray(d.prompts)))e.push('Поле prompts должно быть объектом');
  }else if(d.exportType==='project'){
    if(!d.project||typeof d.project!=='object'||Array.isArray(d.project))e.push('Нет корректного project');
    else if(!d.project.id)e.push('У проекта нет id');
  }else e.push('Неизвестный exportType');
  return e;
}
function importFull(d){
  const exist=new Set(state.projects.map(p=>p.id));
  const conflict=d.projects.map(p=>p.id).filter(id=>exist.has(id));
  modal('Импорт полной копии',`<p><b>Экспортирован:</b> ${esc(fmt(d.exportedAt))}</p><p><b>Схема:</b> v${d.schemaVersion}</p><p><b>Проектов:</b> ${d.projects.length}</p><p><b>Идей:</b> ${(d.ideas||[]).length}</p><p><b>Совпадает по id:</b> ${conflict.length}</p>${conflict.length?`<ul style="margin:6px 0 0 18px">${conflict.map(id=>{const c=state.projects.find(x=>x.id===id);return`<li>${esc(c?c.title:id)}</li>`}).join('')}</ul>`:''}<hr style="border:0;border-top:1px solid var(--ln);margin:14px 0"><div class="row" style="flex-direction:column;align-items:stretch;gap:8px"><button class="btn pri" id="imp-add">Добавить новые</button><button class="btn" id="imp-full">⚠ Восстановить полную</button><button class="btn gho" id="imp-cancel">Отмена</button></div>`);
  $('imp-cancel').onclick=closeModal;
  $('imp-add').onclick=()=>{let a=0,s=0;d.projects.forEach(p=>{if(exist.has(p.id)){s++;return}migrateProject(p);state.projects.push(p);a++});(d.ideas||[]).forEach(i=>{if(!state.ideas.some(x=>x.id===i.id))state.ideas.push(i)});Object.assign(state.prompts,d.prompts||{});persist();closeModal();render();toast(`Добавлено: ${a}, пропущено: ${s}`,'ok')};
  $('imp-full').onclick=()=>{
    if(!confirm('Заменить ВСЮ базу?'))return;
    if(confirm('Скачать резервную копию перед заменой?'))exportAll();
    try{state.projects=d.projects.map(p=>{migrateProject(p);return p});state.ideas=d.ideas||[];state.prompts=d.prompts||{};pid=state.projects[0].id;persist();closeModal();render();toast('База восстановлена','ok')}catch(e){toast('Ошибка: '+e.message,'err')}
  };
}
function importProjectFlow(d){
  const inc=d.project,ex=state.projects.find(p=>p.id===inc.id),conf=!!ex;
  modal('Импорт проекта',`<p><b>Название:</b> ${esc(inc.title||'—')}</p><p><b>Экспортирован:</b> ${esc(fmt(d.exportedAt))}</p><p><b>Обновлён:</b> ${esc(fmt(inc.updatedAt))}</p><p><b>Схема:</b> v${d.schemaVersion}</p>${conf?`<p class="bdg wn">ID уже существует</p><p style="margin-top:8px"><b>Текущая:</b> «${esc(ex.title)}» — ${esc(ex.status)}, ${esc(fmt(ex.updatedAt))}</p><p><b>Импортируемая:</b> «${esc(inc.title)}» — ${esc(inc.status)}, ${esc(fmt(inc.updatedAt))}</p><p class="mut" style="font-size:12px">Автослияния нет.</p><div class="row" style="flex-direction:column;align-items:stretch;gap:8px;margin-top:12px"><button class="btn pri" id="imp-replace">Заменить</button><button class="btn" id="imp-keep">Сохранить обе</button><button class="btn gho" id="imp-cancel">Отмена</button></div>`:`<p class="bdg ok">Конфликта нет</p><div class="row" style="flex-direction:column;align-items:stretch;gap:8px;margin-top:12px"><button class="btn pri" id="imp-add">Добавить</button><button class="btn gho" id="imp-cancel">Отмена</button></div>`}`);
  $('imp-cancel').onclick=closeModal;
  if(conf){
    $('imp-replace').onclick=()=>{
      if(!confirm('Заменить? Изменения текущей будут потеряны.'))return;
      try{migrateProject(inc);state.projects[state.projects.findIndex(x=>x.id===inc.id)]=inc;pid=inc.id;persist();closeModal();render();toast('Заменён','ok')}catch(e){toast('Ошибка: '+e.message,'err')}
    };
    $('imp-keep').onclick=()=>{
      try{const c=JSON.parse(JSON.stringify(inc));c.id=uid();c.title=inc.title+' (импорт)';migrateProject(c);state.projects.push(c);persist();closeModal();render();toast('Добавлен как копия','ok')}catch(e){toast('Ошибка: '+e.message,'err')}
    };
  }else{
    $('imp-add').onclick=()=>{try{migrateProject(inc);state.projects.push(inc);pid=inc.id;persist();closeModal();render();toast('Добавлен','ok')}catch(e){toast('Ошибка: '+e.message,'err')}};
  }
}

/* --- help --- */
function showHelp(){
  const m={idb:'IndexedDB',ls:'localStorage',memory:'в памяти (НЕ сохраняется!)',unknown:'не определено'}[storage.mode()]||'не определено';
  modal('Справка',`<h3>Хранение: ${m}</h3><p>Данные локально в этом браузере. Очистка — стирает.</p>${m.includes('памяти')?'<p class="bdg bd">Внимание: не сохраняется! Делай экспорт.</p>':''}<h3>Экспорт / Импорт</h3><p>Всё в разделе «📦 Данные» (кнопка в шапке или в сайдбаре). В других разделах файловых полей нет — специально, чтобы ничего не мешало.</p><h3>DeepSeek</h3><p>Ручной режим. Нужен интернет. Остальное офлайн.</p>`);
}

/* --- init --- */
function initUI(){
  document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>setView(b.dataset.view));
  document.querySelectorAll('.bn-item').forEach(b=>b.onclick=()=>setView(b.dataset.view));
  $('btn-goto-data').onclick=()=>setView('data');
  $('btn-help').onclick=showHelp;
  $('sheet-close').onclick=closeSheet;
  $('more-sheet').onclick=e=>{if(e.target.id==='more-sheet')closeSheet()};
  $('modal-close').onclick=closeModal;
  $('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
}
async function boot(){
  try{await loadState()}catch(e){console.error('load fail:',e);state=defaultState()}
  if(!state||!Array.isArray(state.projects)||!state.projects.length)state=defaultState();
  pid=state.projects[0].id;
  initUI();
  render();
  try{await persist()}catch(e){console.warn('persist:',e)}
  if(!storage.isPersistent()){
    setTimeout(()=>{
      modal('Данные не сохраняются',`<p class="bdg bd">Браузер блокирует хранилище</p><p style="margin-top:10px">Приложение работает, но изменения <b>не сохранятся</b> после закрытия вкладки.</p><p><b>Причины:</b> приватный режим, блокировка хранилища, file:// в некоторых браузерах.</p><p><b>Что делать:</b></p><ul style="margin:8px 0 0 18px"><li>Делай «⭳ Экспорт» в разделе «📦 Данные».</li><li>Открой в обычном окне (не приватном).</li><li>Попробуй другой браузер.</li></ul><div class="row" style="margin-top:14px"><button class="btn pri" id="warn-continue">Продолжить</button></div>`);
      $('warn-continue').onclick=closeModal;
    },300);
  }
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
</script>
